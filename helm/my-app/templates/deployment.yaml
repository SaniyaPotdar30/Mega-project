apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-detector-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: text-detector-app
  template:
    metadata:
      labels:
        app: text-detector-app
    spec:
      containers:
        - name: text-detector-app
          image: "omteke/cloud-text-detection:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
